
name: Aggiorna calendari LND

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: python -m pip install requests

      - name: Importa i calendari ufficiali LND
        run: python scripts/update_lnd.py

      - name: Salva i calendari aggiornati
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.json
            git commit -m "Aggiorna calendari Attività di Base da LND"
            git push
          else
            echo "Nessuna variazione nei calendari LND."
          fi
